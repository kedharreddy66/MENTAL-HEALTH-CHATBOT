<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MH Chatbot — Auth</title>
  <meta name="color-scheme" content="light" />
  <style>
    :root{
      --primary: hsl(16, 82%, 58%);
      --primary-2: hsl(30, 80%, 60%);
      --secondary: hsl(178, 42%, 52%);
      --bg: hsl(28, 25%, 97%);
      --card: hsl(0, 0%, 100%);
      --border: hsl(30, 15%, 85%);
      --muted: hsl(20, 14%, 40%);
      --radius: 0.75rem;
      --ring: 0 0 0 3px color-mix(in oklab, var(--primary) 35%, transparent);
    }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0; font:16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:hsl(20 14% 15%); background:var(--bg); overflow-x:hidden;
    }

    /* Soft abstract background */
    body::before{ content:""; position:fixed; inset:0; z-index:-2; background:
      radial-gradient(1200px 600px at 12% -5%, color-mix(in oklab, var(--primary) 22%, transparent), transparent 60%),
      radial-gradient(1100px 680px at 88% 105%, color-mix(in oklab, var(--secondary) 20%, transparent), transparent 60%),
      linear-gradient(135deg, var(--bg) 0%, #fff 50%, var(--bg) 100%);
      filter:saturate(.98) contrast(1.02);
    }
    body::after{ content:""; position:fixed; inset:0; z-index:-1; background: linear-gradient(135deg, rgba(16,12,10,.50), rgba(16,12,10,.25)); }

    main{ min-height:100svh; display:grid; place-items:center; padding:20px; animation:fade-in .4s ease both }
    .card{ width:min(460px, 92vw); border:1px solid var(--border); border-radius:var(--radius);
      background:rgba(255,255,255,.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      box-shadow:0 15px 40px rgba(0,0,0,.14); overflow:clip; animation:scale-in .25s ease both; }
    .pad{ padding:22px }

    .title{ margin:2px 0 4px; font-weight:900; letter-spacing:.2px; font-size:clamp(22px, 5vw, 30px); line-height:1.1;
      background:linear-gradient(135deg, var(--primary), var(--primary-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .subtitle{ margin:0 0 10px; color:color-mix(in oklab, var(--muted) 92%, black 8%) }

    /* Tabs (CSS only) */
    .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:8px; background:hsl(0 0% 100% / .7); border:1px solid var(--border); border-radius:12px; padding:6px }
    .seg{ display:grid; place-items:center; height:40px; border-radius:10px; font-weight:700; color:hsl(20 14% 30%); cursor:pointer; transition:transform .12s, box-shadow .2s, background .2s }
    .seg:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.06) }
    .vh{ position:absolute !important; inline-size:1px; block-size:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; clip-path:inset(50%) }

    .pane{ display:none; animation:slide-up .25s ease both }
    #tab-in:checked ~ main .card .pane--in{ display:block }
    #tab-up:checked ~ main .card .pane--up{ display:block }
    #tab-in:checked ~ main .card .tabs label[for="tab-in"],
    #tab-up:checked ~ main .card .tabs label[for="tab-up"]{ background:color-mix(in oklab, var(--primary) 10%, white 90%); box-shadow:0 10px 24px rgba(0,0,0,.08); color:#0f172a }

    form{ display:grid; gap:10px; margin-top:12px }
    label.field{ font-size:12px; color:color-mix(in oklab, var(--muted) 85%, black 15%) }
    .input{ height:44px; width:100%; padding:0 12px; border-radius:var(--radius); border:1px solid var(--border); background:#fff; color:hsl(20 14% 15%); outline:none; transition:box-shadow .2s, border-color .2s }
    .input:focus-visible{ border-color:var(--primary); box-shadow:var(--ring) }
    .field-wrap{ position:relative }
    .toggle-eye{ position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer; color:hsl(20 14% 35%); padding:4px; border-radius:8px }
    .toggle-eye:hover{ color:hsl(20 14% 20%) }

    .btn{ height:44px; display:inline-grid; place-items:center; padding:0 14px; border-radius:var(--radius); border:1px solid var(--border); cursor:pointer; font-weight:800; letter-spacing:.2px; transition: transform .08s, box-shadow .2s, background .2s }
    .btn:hover{ transform:translateY(-1px); box-shadow:0 12px 26px rgba(0,0,0,.12) }
    .btn:active{ transform:translateY(0) }
    .btn-primary{ color:#fff; background:linear-gradient(135deg, var(--primary), var(--primary-2)); border-color:transparent }
    .btn-outline{ background:transparent; color:hsl(20 14% 15%) }
    .row{ display:grid; gap:10px; grid-template-columns:1fr 1fr }
    @media (max-width:480px){ .row{ grid-template-columns:1fr } }

    .alert{ display:none; margin-top:8px; padding:10px 12px; border-radius:10px; background: hsl(16 82% 58% / .08); border:1px solid color-mix(in oklab, var(--primary) 35%, white 65%); color:#7a2e10; font-size:14px }
    .alert.show{ display:block }

    .inline-tabs{ display:grid; grid-template-columns:1fr; gap:8px; background:hsl(0 0% 100% / .7); border:1px solid var(--border); border-radius:12px; padding:4px; margin-top:10px }
    .pill{ display:grid; place-items:center; height:36px; border-radius:10px; font-weight:700; color:hsl(20 14% 30%); cursor:pointer }
    .section{ display:none }
    #si-pw:checked ~ .section--pw{ display:block }
    #si-otp:checked ~ .section--otp{ display:block }
    #si-otp:checked ~ .inline-tabs label[for="si-otp"]{ background:color-mix(in oklab, var(--secondary) 10%, white 90%); box-shadow:0 8px 18px rgba(0,0,0,.08) }

    .otp{ display:flex; gap:10px; justify-content:center; margin:8px 0 12px }
    .otp input{ width:44px; height:56px; text-align:center; font-size:20px; border-radius:10px; border:1px solid var(--border); background:#fff; outline:none }
    .otp input:focus-visible{ border-color:var(--secondary); box-shadow:0 0 0 3px color-mix(in oklab, var(--secondary) 35%, transparent) }
    .otp.error input{ border-color:hsl(0 72% 60%); box-shadow:0 0 0 3px hsl(0 72% 60% / .25) }
    .otp.shake{ animation: shake .35s ease }

    .timer{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:6px }
    .ring{ position:relative; width:54px; height:54px; display:inline-block }
    .ring svg{ width:100%; height:100%; transform: rotate(-90deg) }
    .ring .track{ stroke: hsl(30 15% 90%) }
    .ring .progress{ stroke: hsl(158 65% 45%); stroke-linecap: round; transition: stroke .2s linear; filter: drop-shadow(0 2px 4px rgba(0,0,0,.08)) }
    .ring .label{ position:absolute; inset:0; display:grid; place-items:center; font-size:11px; font-weight:800; color:#0f172a }
    @keyframes fade-in{ from{ opacity:0 } to{ opacity:1 } }
    @keyframes scale-in{ from{ opacity:0; transform:translateY(8px) scale(.98) } to{ opacity:1; transform:none } }
    @keyframes slide-up{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
    @keyframes shake{ 0%,100%{ transform:translateX(0) } 20%{ transform:translateX(-6px) } 40%{ transform:translateX(6px) } 60%{ transform:translateX(-4px) } 80%{ transform:translateX(4px) } }
  </style>
</head>
<body>
  <!-- CSS-only tab state -->
  <input class="vh" type="radio" name="tab" id="tab-in" checked>
  <input class="vh" type="radio" name="tab" id="tab-up">

  <main>
    <section class="card" role="region" aria-label="Authentication">
      <div class="pad">
        <h1 class="title">Welcome</h1>
        <p class="subtitle">Sign in or create your account to continue</p>

        <div class="tabs" role="tablist" aria-label="Auth tabs">
          <label class="seg" for="tab-in" role="tab" aria-controls="pane-in">Sign In</label>
          <label class="seg" for="tab-up" role="tab" aria-controls="pane-up">Sign Up</label>
        </div>

        <!-- Sign In Pane -->
        <section id="pane-in" class="pane pane--in" aria-labelledby="tab-in">
          <!-- Sub toggle: password vs one-time code -->
          <input class="vh" type="radio" name="si" id="si-pw" checked>
          <input class="vh" type="radio" name="si" id="si-otp">

          <div class="inline-tabs" role="tablist" aria-label="Sign-in method">
            <label class="pill" for="si-otp" role="tab" style="grid-column:1/-1;">Sign in with OTP</label>
          </div>

          <div class="section section--pw">
            <form id="form-in" novalidate>
              <div>
                <label class="field" for="in-email">Email</label>
                <input class="input" id="in-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
              </div>
              <div>
              <label class="field" for="in-pass">Password</label>
              <div class="field-wrap">
                <input class="input" id="in-pass" type="password" name="password" placeholder="Your password" autocomplete="current-password" required>
                <button type="button" id="eye-in" class="toggle-eye" aria-label="Show password" title="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
                </button>
              </div>
              </div>
              <button class="btn btn-primary" id="btn-in" type="submit">Sign In</button>
              <div id="alert-in" class="alert" role="alert"></div>
            </form>
          </div>

          <div class="section section--otp">
            <form id="form-in-otp" novalidate>
              <div>
                <label class="field" for="li-email">Email</label>
                <input class="input" id="li-email" type="email" placeholder="you@example.com" autocomplete="email" required>
              </div>
              <div class="row">
                <button class="btn btn-outline" id="btn-li-send" type="button">Send Code</button>
                <button class="btn btn-primary" id="btn-li-verify" type="button">Verify Code</button>
              </div>
              <div id="li-otp" style="display:none">
                <div style="text-align:center; letter-spacing:.25em; font-weight:800">Enter Code</div>
                <div id="li-otp-boxes" class="otp" aria-label="One-time code">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
                  <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
                </div>
                <div class="timer">
                  <div class="ring" id="li-exp" title="Code expires">
                    <svg viewBox="0 0 60 60" aria-hidden="true">
                      <circle class="track" cx="30" cy="30" r="26" stroke-width="6" fill="none"></circle>
                      <circle class="progress" id="li-exp-prog" cx="30" cy="30" r="26" stroke-width="6" fill="none" stroke-dasharray="163.362817" stroke-dashoffset="163.362817"></circle>
                    </svg>
                    <div class="label" id="li-exp-txt">0:00</div>
                  </div>
                </div>
              </div>
              <div style="display:flex; justify-content:center; margin-top:6px">
                <label for="si-pw" class="btn btn-outline" role="button">Back</label>
              </div>
              <div id="alert-in-otp" class="alert" role="alert"></div>
            </form>
          </div>
        </section>

        <!-- Sign Up Pane (OTP required; collects password) -->
        <section id="pane-up" class="pane pane--up" aria-labelledby="tab-up">
          <form id="form-up" novalidate>
            <div>
              <label class="field" for="up-user">Username</label>
              <input class="input" id="up-user" type="text" name="username" placeholder="Your name" autocomplete="username" required>
            </div>
            <div>
              <label class="field" for="up-email">Email</label>
              <input class="input" id="up-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div>
              <label class="field" for="up-pass">Password</label>
              <div class="field-wrap">
                <input class="input" id="up-pass" type="password" name="password" placeholder="Create a password (6+ chars)" autocomplete="new-password" minlength="6" required>
                <button type="button" id="eye-up" class="toggle-eye" aria-label="Show password" title="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5c-5 0-9 4.5-10 7 1 2.5 5 7 10 7s9-4.5 10-7c-1-2.5-5-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
                </button>
              </div>
            </div>
            <div class="row">
              <button class="btn btn-outline" id="btn-up-send" type="button">Send Code</button>
              <button class="btn btn-primary" id="btn-up-verify" type="button">Verify & Create</button>
            </div>
            <div id="up-otp" style="display:none">
              <div style="text-align:center; letter-spacing:.25em; font-weight:800">Enter Code</div>
              <div id="up-otp-boxes" class="otp" aria-label="Verification code">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5">
                <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 6">
              </div>
              <div class="timer">
                <div class="ring" id="up-exp" title="Code expires">
                  <svg viewBox="0 0 60 60" aria-hidden="true">
                    <circle class="track" cx="30" cy="30" r="26" stroke-width="6" fill="none"></circle>
                    <circle class="progress" id="up-exp-prog" cx="30" cy="30" r="26" stroke-width="6" fill="none" stroke-dasharray="163.362817" stroke-dashoffset="163.362817"></circle>
                  </svg>
                  <div class="label" id="up-exp-txt">0:00</div>
                </div>
              </div>
            </div>
            <div id="alert-up" class="alert" role="alert"></div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script>
    (function(){
      const $ = (id) => document.getElementById(id);
      const ORIGIN = (window.location && window.location.origin && window.location.origin.startsWith('http'))
        ? window.location.origin
        : (localStorage.getItem('mh_origin') || 'http://127.0.0.1:8000');
      const EP = {
        login: ORIGIN + '/login',
        signupReq: ORIGIN + '/auth/signup/request',
        signupVer: ORIGIN + '/auth/signup/verify',
        loginReq: ORIGIN + '/auth/login/request',
        loginVer: ORIGIN + '/auth/login/verify',
        chat: ORIGIN + '/chat.html',
      };

      async function jsonFetch(url, body){
        const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
        let d = null; try { d = await r.json(); } catch(e){}
        if(!r.ok) throw new Error((d && (d.error || d.detail)) || ('HTTP '+r.status));
        return d;
      }
      function setBusy(btn, busy){ if(!btn) return; btn.disabled = !!busy; btn.style.opacity = busy ? .75 : 1; }
      function showAlert(el, msg){ if(!el) return; el.textContent = msg; el.classList.add('show'); setTimeout(()=> el.classList.remove('show'), 3000); }
      function shakeAndClear(containerId){
        const el = $(containerId); if(!el) return;
        el.classList.remove('shake'); el.classList.add('error');
        // force reflow to restart animation
        void el.offsetWidth; el.classList.add('shake');
        el.querySelectorAll('input').forEach(i=> i.value='');
        setTimeout(()=> el.classList.remove('error'), 400);
        const first = el.querySelector('input'); if(first) first.focus();
      }
      function mmss(n){ n=Math.max(0, n|0); const m = Math.floor(n/60); const s = n%60; return `${m}:${String(s).padStart(2,'0')}`; }
      let tLogin = null, tSignup = null;
      function wireEye(btnId, inputId){
        const btn = document.getElementById(btnId); const inp = document.getElementById(inputId);
        if(!btn || !inp) return;
        btn.addEventListener('click', ()=>{
          const isPw = inp.getAttribute('type') === 'password';
          inp.setAttribute('type', isPw ? 'text' : 'password');
          btn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
          btn.setAttribute('title', isPw ? 'Hide password' : 'Show password');
        });
      }
      function startTimers(kind, cooldown, expiresIn){
        const btn = kind==='login' ? $('btn-li-send') : $('btn-up-send');
        const elExp = kind==='login' ? $('li-exp') : $('up-exp');
        const elExpTxt = kind==='login' ? $('li-exp-txt') : $('up-exp-txt');
        const elProg = kind==='login' ? $('li-exp-prog') : $('up-exp-prog');
        if(!elExp || !btn || !elProg) return;
        const total = Number(expiresIn)||600;
        const now = Math.floor(Date.now()/1000);
        let expEnd = now + total;
        let cdEnd = now + (Number(cooldown)||0);
        const C = 2*Math.PI*26; // circumference for r=26
        // ensure dasharray is set
        elProg.setAttribute('stroke-dasharray', String(C));
        const hueFor = (f)=>{
          const frac = Math.max(0, Math.min(1, f));
          if(frac >= 0.5){
            const t = (frac - 0.5) / 0.5; // 0..1
            return 60 + (158 - 60) * t; // 60 -> 158
          }else{
            const t = frac / 0.5; // 0..1
            return 0 + (60 - 0) * t;    // 0 -> 60
          }
        };
        const setState = ()=>{
          const n = Math.floor(Date.now()/1000);
          const expLeft = Math.max(0, expEnd - n);
          const cdLeft = Math.max(0, cdEnd - n);
          const frac = total > 0 ? (expLeft/total) : 0;
          const pct = Math.max(0, Math.min(100, Math.round(frac*100)));
          const targetOffset = C * (1 - frac);
          // no spring, just set; call tick for fluid
          elProg.setAttribute('stroke-dashoffset', String(targetOffset));
          if(elExpTxt) elExpTxt.textContent = mmss(expLeft);
          if(cdLeft>0){ btn.disabled = true; btn.textContent = `Resend (${mmss(cdLeft)})`; }
          else { btn.disabled = false; btn.textContent = 'Resend Code'; }
        };
        // interval for text + cooldown
        const handle = setInterval(setState, 1000);
        // RAF loop for fluid ring updates between seconds
        let rafId = 0;
        const tick = ()=>{
          const nowMs = Date.now()/1000;
          const left = Math.max(0, expEnd - nowMs);
          const frac = total>0 ? (left/total) : 0;
          const C = 2*Math.PI*26;
          elProg.setAttribute('stroke-dashoffset', String(C * (1 - Math.max(0, Math.min(1, frac)))));
          const hue = hueFor(frac);
          elProg.setAttribute('stroke', `hsl(${Math.round(hue)} 80% 50%)`);
          rafId = requestAnimationFrame(tick);
        };
        tick();
        const ref = { handle };
        if(kind==='login'){
          if(tLogin) { clearInterval(tLogin.handle); cancelAnimationFrame(tLogin.rafId||0); }
          tLogin = { handle, rafId };
        } else {
          if(tSignup) { clearInterval(tSignup.handle); cancelAnimationFrame(tSignup.rafId||0); }
          tSignup = { handle, rafId };
        }
      }
      function wireOtp(container){
        if(!container) return ()=>'';
        const boxes = Array.from(container.querySelectorAll('input'));
        boxes.forEach((inp,i)=>{
          inp.addEventListener('input', e=>{ const t=e.target; t.value=t.value.replace(/\D/g,'').slice(-1); if(t.value && i<boxes.length-1) boxes[i+1].focus(); });
          inp.addEventListener('keydown', e=>{ if(e.key==='Backspace' && !inp.value && i>0) boxes[i-1].focus(); });
          inp.addEventListener('paste', e=>{ const txt=(e.clipboardData||window.clipboardData).getData('text'); if(/^\d{6}$/.test(txt)){ e.preventDefault(); boxes.forEach((b,j)=> b.value = txt[j]||''); boxes[boxes.length-1].focus(); } });
        });
        return ()=> boxes.map(b=> (b.value||'').trim()).join('');
      }

      const getLiCode = wireOtp($('li-otp-boxes'));
      const getUpCode = wireOtp($('up-otp-boxes'));

      // Eyes (password visibility)
      wireEye('eye-in','in-pass');
      wireEye('eye-up','up-pass');

      // Sign In (password)
      $('form-in')?.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const email = $('in-email')?.value.trim();
        const password = $('in-pass')?.value || '';
        if(!(email && password)) { showAlert($('alert-in'),'Enter email and password'); return; }
        setBusy($('btn-in'), true);
        try{
          const d = await jsonFetch(EP.login, { email, password });
          localStorage.setItem('mh_token', d.token);
          localStorage.setItem('mh_user', d.user?.username || d.user?.email || '');
          location.href = EP.chat;
        }catch(err){ showAlert($('alert-in'), err.message || 'Sign in failed'); }
        finally{ setBusy($('btn-in'), false); }
      });

      // Sign In (OTP)
      $('btn-li-send')?.addEventListener('click', async ()=>{
        const email = $('li-email')?.value.trim();
        if(!(email && email.includes('@'))) { showAlert($('alert-in-otp'),'Enter a valid email'); return; }
        setBusy($('btn-li-send'), true);
        try{
          const d = await jsonFetch(EP.loginReq, { email });
          $('li-otp').style.display = 'block';
          showAlert($('alert-in-otp'), 'Code sent to ' + email);
          startTimers('login', d.cooldown ?? 30, d.expires_in ?? 600);
        }catch(err){ showAlert($('alert-in-otp'), err.message || 'Failed to send code'); }
        finally{ setBusy($('btn-li-send'), false); }
      });
      $('btn-li-verify')?.addEventListener('click', async ()=>{
        const email = $('li-email')?.value.trim();
        const code = getLiCode();
        if(!email || code.length!==6) { showAlert($('alert-in-otp'),'Enter the 6-digit code'); return; }
        setBusy($('btn-li-verify'), true);
        try{
          const d = await jsonFetch(EP.loginVer, { email, code });
          localStorage.setItem('mh_token', d.token);
          localStorage.setItem('mh_user', d.user?.username || d.user?.email || '');
          location.href = EP.chat;
        }catch(err){ showAlert($('alert-in-otp'), err.message || 'Verification failed'); shakeAndClear('li-otp-boxes'); }
        finally{ setBusy($('btn-li-verify'), false); }
      });

      // Sign Up (OTP required; collects password)
      $('btn-up-send')?.addEventListener('click', async ()=>{
        const username = $('up-user')?.value.trim();
        const email = $('up-email')?.value.trim();
        const password = $('up-pass')?.value || '';
        if(!(username && email && email.includes('@') && password && password.length>=6)) { showAlert($('alert-up'),'Enter username, valid email and 6+ char password'); return; }
        setBusy($('btn-up-send'), true);
        try{
          const d = await jsonFetch(EP.signupReq, { email, username });
          $('up-otp').style.display = 'block';
          showAlert($('alert-up'), 'Code sent to ' + email);
          startTimers('signup', d.cooldown ?? 30, d.expires_in ?? 600);
        }catch(err){ showAlert($('alert-up'), err.message || 'Failed to send code'); }
        finally{ setBusy($('btn-up-send'), false); }
      });
      $('btn-up-verify')?.addEventListener('click', async ()=>{
        const username = $('up-user')?.value.trim();
        const email = $('up-email')?.value.trim();
        const password = $('up-pass')?.value || '';
        const code = getUpCode();
        if(!(username && email && password && password.length>=6) || code.length!==6) { showAlert($('alert-up'),'Enter the 6-digit code and a 6+ char password'); return; }
        setBusy($('btn-up-verify'), true);
        try{
          const d = await jsonFetch(EP.signupVer, { email, username, code, password });
          localStorage.setItem('mh_token', d.token);
          localStorage.setItem('mh_user', d.user?.username || d.user?.email || '');
          location.href = EP.chat;
        }catch(err){ showAlert($('alert-up'), err.message || 'Verification failed'); shakeAndClear('up-otp-boxes'); }
        finally{ setBusy($('btn-up-verify'), false); }
      });
    })();
  </script>
</body>
</html>
