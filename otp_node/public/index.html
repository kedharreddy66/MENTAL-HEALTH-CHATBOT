<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OTP Auth</title>
  <style>
    :root{ --bg:#0b1220; --panel:#121826; --ink:#e6e8ee; --muted:#9aa3b2; --accent1:#4f46e5; --accent2:#06b6d4; --border:rgba(102,112,133,.22); }
    body{ margin:0; background:radial-gradient(1200px 600px at 50% -20%, #0d1630 0%, #0b1220 60%), #0b1220; font:16px/1.55 Inter, ui-sans-serif, system-ui; color:var(--ink); }
    .wrap{ min-height:100svh; display:grid; place-items:center; padding:36px 18px; }
    .shell{ width:min(900px, 96vw); background:rgba(14,20,32,.7); border:1px solid var(--border); border-radius:16px; box-shadow:0 40px 100px rgba(0,0,0,.5); backdrop-filter:blur(14px); overflow:hidden; }
    .bar{ height:4px; background:linear-gradient(90deg, var(--accent1), var(--accent2)); }
    .inner{ display:grid; grid-template-columns:1fr 1fr; }
    .pane{ padding:26px 22px; }
    .split{ width:1px; background:var(--border); }
    h2{ margin:0 0 6px; font-size:20px; font-weight:800; }
    p{ margin:0 0 10px; color:var(--muted); }
    label{ display:block; font-size:12px; color:#c8d0dd; margin-top:10px; }
    input{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:rgba(10,14,24,.8); color:var(--ink); }
    .row{ display:flex; gap:10px; margin-top:12px; align-items:center; }
    .btn{ height:44px; padding:0 16px; border:none; border-radius:12px; font-weight:800; cursor:pointer; }
    .btn-primary{ background:linear-gradient(135deg, var(--accent1), var(--accent2)); color:#fff; }
    .btn-ghost{ background:rgba(10,14,24,.8); color:#e6e8ee; border:1px solid var(--border); }
    .muted{ font-size:12px; color:var(--muted); min-height:18px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="shell">
      <div class="bar"></div>
      <div class="inner">
        <div class="pane">
          <h2>Sign Up</h2>
          <p>Enter your email and a username. We’ll send a 6‑digit code.</p>
          <label>Email</label>
          <input id="su_email" type="email" placeholder="you@example.com" />
          <label>Username</label>
          <input id="su_username" type="text" placeholder="yourname" />
          <div class="row"><button class="btn btn-primary" onclick="su_request()">Send Code</button></div>
          <div class="row" id="su_code_row" style="display:none">
            <input id="su_code" placeholder="6-digit code" />
            <button class="btn" onclick="su_verify()">Verify & Create</button>
            <button class="btn btn-ghost" id="su_resend" onclick="su_request()">Resend</button>
          </div>
          <div class="muted" id="su_msg"></div>
        </div>
        <div class="split"></div>
        <div class="pane">
          <h2>Login</h2>
          <p>Use your email. We’ll send a 6‑digit code.</p>
          <label>Email</label>
          <input id="li_email" type="email" placeholder="you@example.com" />
          <div class="row"><button class="btn btn-primary" onclick="li_request()">Send Code</button></div>
          <div class="row" id="li_code_row" style="display:none">
            <input id="li_code" placeholder="6-digit code" />
            <button class="btn" onclick="li_verify()">Verify</button>
            <button class="btn btn-ghost" id="li_resend" onclick="li_request()">Resend</button>
          </div>
          <div class="muted" id="li_msg"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function su_request(){
      const email = document.getElementById('su_email').value.trim();
      const username = document.getElementById('su_username').value.trim();
      const msg = document.getElementById('su_msg'); msg.textContent='';
      if(!email || !username){ msg.textContent = 'Enter email and username'; return; }
      try{
        const r = await fetch('/auth/otp/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        document.getElementById('su_code_row').style.display='flex';
        msg.textContent = `Code sent to ${d.masked || email}. Expires in ${d.expires_in/60} min.`;
      }catch(e){ msg.textContent = e.message || String(e); }
    }
    async function su_verify(){
      const email = document.getElementById('su_email').value.trim();
      const code = document.getElementById('su_code').value.trim();
      const msg = document.getElementById('su_msg'); msg.textContent='';
      if(!email || !code){ msg.textContent = 'Enter email and code'; return; }
      try{
        const r = await fetch('/auth/otp/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        localStorage.setItem('mh_token', d.token);
        localStorage.setItem('mh_user', email);
        alert('Signed up! You can now navigate to your app.');
      }catch(e){ msg.textContent = e.message || String(e); }
    }
    async function li_request(){
      const email = document.getElementById('li_email').value.trim();
      const msg = document.getElementById('li_msg'); msg.textContent='';
      if(!email){ msg.textContent = 'Enter email'; return; }
      try{
        const r = await fetch('/auth/otp/request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        document.getElementById('li_code_row').style.display='flex';
        msg.textContent = `Code sent to ${d.masked || email}. Expires in ${d.expires_in/60} min.`;
      }catch(e){ msg.textContent = e.message || String(e); }
    }
    async function li_verify(){
      const email = document.getElementById('li_email').value.trim();
      const code = document.getElementById('li_code').value.trim();
      const msg = document.getElementById('li_msg'); msg.textContent='';
      if(!email || !code){ msg.textContent = 'Enter email and code'; return; }
      try{
        const r = await fetch('/auth/otp/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        localStorage.setItem('mh_token', d.token);
        localStorage.setItem('mh_user', email);
        alert('Logged in! You can now navigate to your app.');
      }catch(e){ msg.textContent = e.message || String(e); }
    }
  </script>
</body>
</html>
