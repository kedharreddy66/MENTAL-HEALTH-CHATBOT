<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MH Chatbot   </title>
  <style>
    :root{ --bg:#f5f5f7; --panel:#fff; --teal:#0a84ff; --bot:#eef1f6; --me:#0a84ff; --me-text:#fff; --muted:#6e6e73; --shadow:0 16px 40px rgba(0,0,0,.08); --radius:18px; --radius-big:22px; --maxw:860px; }
    *{ box-sizing:border-box }
    html, body { height:100% }
    body{ margin:0; background:var(--bg); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:#111827 }
    .app{ max-width:var(--maxw); margin:0 auto; min-height:100svh; display:flex; flex-direction:column; padding-top:12px }
    @supports not (height:100svh){ .app{ min-height:100dvh } }
    .header{ position:sticky; top:12px; margin:0 16px; background:var(--teal); border-radius:14px; color:#fff; padding:12px 14px; z-index:2; box-shadow:0 8px 20px rgba(0,0,0,.12); display:grid; grid-template-columns:auto 1fr auto; align-items:center }
    .header h1{ margin:0; font-size:18px; font-weight:700; letter-spacing:.2px; grid-column:2; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .header-left{ grid-column:1; display:flex; align-items:center; gap:8px }
    .header-actions{ grid-column:3; display:flex; gap:8px; justify-self:end }
    @media (max-width:600px){ .header h1{ font-size:16px } }
    .auth-row{ display:flex; gap:8px; margin-top:10px }
    .badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 10px; border-radius:9999px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35) }
    .btn{ height:34px; padding:0 12px; border-radius:10px; border:none; cursor:pointer; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.12) }
    .btn-primary{ background:#0a7f7f; color:#fff }
    .btn-ghost{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35) }
    .btn:disabled{ opacity:.6; cursor:not-allowed }
    .panel{ background:var(--panel); margin:16px; border-radius:20px; box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:0; overflow:hidden; flex:1 }
    .messages{ padding:18px 16px 12px; overflow:auto; display:flex; flex-direction:column; flex:1; gap:10px; scrollbar-gutter:stable both-edges; overscroll-behavior:contain; -webkit-overflow-scrolling:touch }
    .row{ display:flex; width:100% }
    .row.me{ justify-content:flex-end }
    .row.bot{ justify-content:flex-start }
    .bubble{ max-width:72%; padding:10px 12px; border-radius:var(--radius); position:relative; word-wrap:break-word; white-space:pre-wrap; box-shadow:0 2px 6px rgba(0,0,0,.05) }
    .row.me .bubble{ background:var(--me); color:var(--me-text); border-top-right-radius:var(--radius-big); border-bottom-right-radius:6px }
    .row.bot .bubble{ background:var(--bot); color:#111827; border-top-left-radius:var(--radius-big); border-bottom-left-radius:6px }
    .meta{ font-size:12px; color:var(--muted); margin-top:4px; user-select:none }
    .row.me .meta{ text-align:right; opacity:.9; color:#e6f2ff }
    .row.bot .meta{ text-align:left }
    .composer{ position:sticky; bottom:0; left:0; right:0; z-index:3; border-top:1px solid #e5e7eb; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; background:var(--bg) }
    textarea{ flex:1; resize:none; min-height:40px; max-height:160px; border:1.5px solid #cbd5e1; border-radius:9999px; padding:10px 14px; background:#fff; color:#111827; outline:none; font:inherit; box-shadow:inset 0 1px 2px rgba(0,0,0,.04); transition:box-shadow .2s, border-color .2s }
    textarea:focus{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,122,122,.15), inset 0 1px 2px rgba(0,0,0,.04) }
    textarea::placeholder{ color:#9ca3af }
    .send-btn{ width:44px; height:44px; padding:0; border:none; border-radius:50%; background:var(--teal); color:#fff; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.12); display:inline-flex; align-items:center; justify-content:center }
    .send-btn:disabled{ opacity:.6; cursor:not-allowed }
    .typing{ display:inline-flex; gap:6px; align-items:center }
    .typing .dot{ width:6px; height:6px; border-radius:50%; background:#9aa1ac; animation:blink 1.2s infinite }
    .typing .dot:nth-child(2){ animation-delay:.15s } .typing .dot:nth-child(3){ animation-delay:.3s }
    @keyframes blink{ 0%,80%,100%{ opacity:.25; transform:translateY(0);} 40%{ opacity:1; transform:translateY(-2px);} }
    @media (max-width:600px){ .bubble{ max-width:85% } .panel{ margin:12px } .header{ margin:0 12px } .header-actions{ right:12px } }
    .signal{ display:inline-flex; gap:3px; align-items:flex-end; height:18px }
    .signal .bar{ width:4px; border-radius:2px; background:rgba(255,255,255,.35); opacity:.7; transition:background .2s, opacity .2s }
    .signal .bar.active{ background:#fff; opacity:1 }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <div id="signal" class="signal" role="status" aria-live="polite" title="Connectivity">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </div>
      <h1>MH-ChatBot  </h1>
      <div class="header-actions">
        <button id="provider" class="btn btn-ghost" title="Switch AI model">  Model: Ollama</button>
        <button id="reset" class="btn btn-ghost" title="Start a new chat">Reset</button>
      </div>
    </div>

    <div class="panel">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer">
        <textarea id="input" placeholder=""></textarea>
        <button id="send" class="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    // No authentication: simplify state and UI

    const ORIGIN = (window.location && window.location.origin && window.location.origin.startsWith('http'))
      ? window.location.origin : (localStorage.getItem('mh_origin') || 'http://127.0.0.1:8000');
    const API_URL = `${ORIGIN}/chat`;
    const RESET_URL = `${ORIGIN}/reset`;

    let PROVIDER = localStorage.getItem('mh_provider') || 'ollama';
    let STATE = {};

    const providerBtn = document.getElementById('provider');
    const resetBtn = document.getElementById('reset');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // No auth headers required

    // Connectivity signal
    const signalEl = document.getElementById('signal');
    const signalBars = () => Array.from(signalEl.querySelectorAll('.bar'));
    function renderSignal(level){ const bars = signalBars(); bars.forEach((b,i)=>{ if(i < level) b.classList.add('active'); else b.classList.remove('active'); }); }
    async function pingOnce(timeoutMs=3000){ const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), timeoutMs); const start = performance.now(); try{ const resp = await fetch(`${ORIGIN}/health`, { method:'GET', signal: ctrl.signal, cache:'no-store' }); clearTimeout(t); if(!resp.ok) throw 0; const ms = performance.now() - start; return ms; }catch(_){ clearTimeout(t); return null; } }
    function levelFromMs(ms){ if(ms==null) return 0; if(ms<100) return 5; if(ms<250) return 4; if(ms<600) return 3; if(ms<1200) return 2; if(ms<2000) return 1; return 0; }
    async function refreshSignal(){ const ms = await pingOnce(); renderSignal(levelFromMs(ms)); }
    refreshSignal(); setInterval(()=>{ if(!document.hidden) refreshSignal(); }, 10000);

    function nowStamp(d=new Date()){ return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
    function addMessage(role, text, stamp=nowStamp()){
      const row = document.createElement('div'); row.className = `row ${role}`;
      const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = stamp;
      bubble.appendChild(document.createElement('br')); bubble.appendChild(meta); row.appendChild(bubble);
      messagesEl.appendChild(row); messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }); return row;
    }
    function showTyping(){ const row = document.createElement('div'); row.className = 'row bot'; row.dataset.typing = 'true'; const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.innerHTML = `<span class="typing" aria-label="Bot is typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`; const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = 'typing…'; bubble.appendChild(document.createElement('br')); bubble.appendChild(meta); row.appendChild(bubble); messagesEl.appendChild(row); messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }); return row; }
    function hideTyping(row){ if(row && row.parentNode){ row.parentNode.removeChild(row); } }

    async function send(){
      const text = inputEl.value.trim(); if(!text) return;
      inputEl.value = ''; inputEl.style.height = '44px'; addMessage('me', text);
      sendBtn.disabled = true; inputEl.disabled = true; resetBtn.disabled = true;
      const typingRow = showTyping(); const started = performance.now();
      try{
        const resp = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ message: text, state: STATE, provider: PROVIDER })});
        if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json(); if (data && data.state) STATE = data.state;
        const elapsed = performance.now() - started; if (elapsed < 120) await new Promise(r => setTimeout(r, 120 - elapsed));
        hideTyping(typingRow);
        if (data && data.mode === 'crisis' && Array.isArray(data.messages)) { data.messages.forEach(chunk => addMessage('bot', chunk)); return; }
        const botText = data && (data.reply || data.text) ? (data.reply || data.text) : '…'; addMessage('bot', botText);
      }catch(err){ console.error('Send error:', err); hideTyping(typingRow); addMessage('bot', 'Sorry, I could not reach the server.'); }
      finally{ sendBtn.disabled = false; inputEl.disabled = false; resetBtn.disabled = false; inputEl.focus(); }
    }

    async function resetChat(){
      try{
        resetBtn.disabled = true; sendBtn.disabled = true; inputEl.disabled = true;
        const resp = await fetch(RESET_URL, { method:'POST' }); if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json(); STATE = (data && data.state) ? data.state : {};
        messagesEl.innerHTML = ''; inputEl.value = ''; inputEl.style.height = '44px';
      }catch(err){ console.error('Reset error:', err); addMessage('bot', 'Could not reset. Is the /reset endpoint running?'); }
      finally{ resetBtn.disabled = false; sendBtn.disabled = false; inputEl.disabled = false; inputEl.focus(); }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
    resetBtn.addEventListener('click', resetChat);

    function updateProviderLabel(){ providerBtn.textContent = `Model: ${PROVIDER === 'gemini' ? 'Gemini' : 'Ollama'}`; }
    providerBtn.addEventListener('click', ()=>{ PROVIDER = (PROVIDER === 'ollama') ? 'gemini' : 'ollama'; localStorage.setItem('mh_provider', PROVIDER); updateProviderLabel(); });
    updateProviderLabel();
    (async ()=>{ try{ if(!localStorage.getItem('mh_provider')){ const r = await fetch(`${ORIGIN}/debug/providers`, { method:'GET', cache:'no-store' }); if(r.ok){ const d = await r.json(); if(d && d.gemini && d.gemini.available){ PROVIDER = 'gemini'; localStorage.setItem('mh_provider', PROVIDER); updateProviderLabel(); } } } }catch(_){ } })();

    const autoGrow = () => { inputEl.style.height='auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 160)+'px'; };
    inputEl.addEventListener('input', autoGrow); autoGrow();

    // Removed login/logout helpers; not needed without auth
  </script>
</body>
</html>
