<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    :root{ --bg:#f5f5f7; --panel:#fff; --tint:#0a84ff; --ink:#111315; --muted:#6e6e73; --border:#e5e5ea; --ring:rgba(10,132,255,.25); }
    body{ margin:0; background:var(--bg); font:16px/1.45 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial; color:var(--ink); }
    .wrap{ min-height:100svh; display:grid; place-items:center; padding:24px; }
    .card{ width:min(520px, 92vw); background:var(--panel); border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.08); padding:22px; border:1px solid var(--border); }
    h1{ margin:0 0 6px 0; font-size:22px; font-weight:700; }
    p{ margin:0 0 12px 0; color:var(--muted); }
    label{ display:block; font-size:12px; color:#4d4d4f; margin-top:10px; }
    input{ width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font:inherit; outline:none; }
    input:focus{ box-shadow:0 0 0 4px var(--ring); border-color:var(--tint); }
    .row{ display:flex; gap:10px; margin-top:14px; align-items:center; }
    .btn{ height:42px; padding:0 16px; border:none; border-radius:12px; font-weight:600; cursor:pointer; }
    .btn-primary{ background:var(--tint); color:#fff; }
    .btn-ghost{ background:#f2f2f7; color:#111; border:1px solid var(--border); }
    .oauth{ display:flex; gap:12px; margin-top:10px; }
    .oauth .btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:8px; }
    .muted{ font-size:12px; color:var(--muted); margin-top:8px; }
    .err{ color:#b91c1c; font-size:13px; margin-top:8px; }
    .ok{ color:#065f46; font-size:13px; margin-top:8px; }
    a{ color:var(--tint); text-decoration:none; }
  </style>
  <script>
    const ORIGIN = (window.location && window.location.origin && window.location.origin.startsWith('http'))
      ? window.location.origin
      : (localStorage.getItem('mh_origin') || 'http://127.0.0.1:8000');
    const REQ_URL = `${ORIGIN}/auth/signup/request`;
    const VER_URL = `${ORIGIN}/auth/signup/verify`;
    const CHAT_URL = `${ORIGIN}/chat.html`;

    async function requestCode(){
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const msg = document.getElementById('msg'); msg.textContent = '';
      if(!email || !username){ msg.textContent = 'Enter email and username'; msg.className='err'; return; }
      try{
        const r = await fetch(REQ_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email, username }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        msg.textContent = 'We sent a code to your email.'; msg.className='ok';
        document.getElementById('codeRow').style.display='flex';
      }catch(err){ msg.textContent = String(err.message || err); msg.className='err'; }
    }

    async function verifyCode(){
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const code = document.getElementById('code').value.trim();
      const msg = document.getElementById('msg'); msg.textContent = '';
      if(!email || !username || !code){ msg.textContent = 'Enter email, username and code'; msg.className='err'; return; }
      try{
        const r = await fetch(VER_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ email, username, code }) });
        const d = await r.json();
        if(!r.ok) throw new Error(d && d.error ? d.error : `HTTP ${r.status}`);
        localStorage.setItem('mh_token', d.token);
        localStorage.setItem('mh_user', d.user && d.user.username ? d.user.username : (d.user && d.user.email ? d.user.email : ''));
        window.location = CHAT_URL;
      }catch(err){ msg.textContent = String(err.message || err); msg.className='err'; }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Create your account</h1>
      <p>Enter your email and a username. We’ll email you a 6-digit code to verify.</p>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="yourname" />
      <div class="row"><button class="btn btn-primary" onclick="requestCode()">Send Code</button><a href="/login.html" style="align-self:center">Have an account?</a></div>
      <div id="codeRow" class="row" style="display:none">
        <input id="code" placeholder="6-digit code" />
        <button class="btn" onclick="verifyCode()">Verify & Create</button>
      </div>
      <div class="oauth">
        <a class="btn btn-ghost" href="/auth/google/start">🔵 Continue with Google</a>
        <a class="btn btn-ghost" href="/auth/apple/start"> Sign in with Apple</a>
      </div>
      <div id="msg" class="muted"></div>
    </div>
  </div>
</body>
</html>
